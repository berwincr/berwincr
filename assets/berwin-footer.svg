<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Animated burgundy footer motif</title>
  <defs>
    <linearGradient id="berwin-footer-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126"/>
      <stop offset=".48" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D"/>
    </linearGradient>
    <filter id="berwin-footer-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="100" rx="14" fill="#10070C"/>
  <path d="M28 52H1172" stroke="#451126" stroke-width="1"/>
  <path d="M28 52H1172" stroke="url(#berwin-footer-gradient)" stroke-width="2" stroke-linecap="round" stroke-dasharray="18 12" filter="url(#berwin-footer-glow)">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="9s" repeatCount="indefinite"/>
  </path>
  <circle cx="28" cy="52" r="3" fill="#E5B5C7"/>
  <circle cx="1172" cy="52" r="3" fill="#E5B5C7"/>
  <circle cx="600" cy="52" r="4" fill="#C77B9B">
    <animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="3.8s" repeatCount="indefinite"/>
  </circle>
</svg>
