<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Berwin C R — Developer profile</title>
  <desc id="hero-desc">A cinematic burgundy profile banner with an animated orbital line, fine technical grid, and glowing underline. Berwin C R, IT Student at CEG, Software Developer exploring AI, ML and Data Science.</desc>
  <defs>
    <linearGradient id="berwin-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="berwin-hero-wine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="berwin-hero-glow" cx="78%" cy="42%" r="58%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".42"/>
      <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="berwin-hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-opacity=".09" stroke-width=".7"/>
      <circle cx="0" cy="0" r="1" fill="#E5B5C7" fill-opacity=".16"/>
    </pattern>
    <filter id="berwin-hero-soft-glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="berwin-hero-fade">
      <linearGradient id="berwin-hero-mask-gradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="white"/>
        <stop offset=".78" stop-color="white" stop-opacity=".88"/>
        <stop offset="1" stop-color="white" stop-opacity=".1"/>
      </linearGradient>
      <rect width="1200" height="420" fill="url(#berwin-hero-mask-gradient)"/>
    </mask>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#berwin-hero-bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#berwin-hero-glow)"/>
  <rect width="1200" height="420" rx="22" fill="url(#berwin-hero-grid)" mask="url(#berwin-hero-fade)"/>

  <g fill="none" stroke="#C77B9B" stroke-opacity=".22">
    <circle cx="1000" cy="206" r="138" stroke-width="1"/>
    <circle cx="1000" cy="206" r="176" stroke-width=".8" stroke-dasharray="2 9"/>
    <ellipse cx="1000" cy="206" rx="220" ry="74" transform="rotate(-28 1000 206)" stroke-width="1"/>
    <ellipse cx="1000" cy="206" rx="220" ry="74" transform="rotate(42 1000 206)" stroke-width="1"/>
  </g>
  <g fill="#E5B5C7">
    <circle cx="1000" cy="30" r="2.4" opacity=".8"/>
    <circle cx="1167" cy="205" r="2" opacity=".55"/>
    <circle cx="832" cy="293" r="2.5" opacity=".7"/>
    <circle cx="1088" cy="357" r="1.7" opacity=".65"/>
  </g>
  <circle cx="1000" cy="206" r="5" fill="#C77B9B" opacity=".75">
    <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;.95;.45" dur="4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="78" fill="#C77B9B" font-size="13" letter-spacing="4">DEVELOPER PROFILE / 001</text>
    <text x="74" y="188" fill="#F8F0F3" font-size="68" font-weight="700" letter-spacing="-2">Berwin C R</text>
    <text x="80" y="232" fill="#E5B5C7" font-size="19" letter-spacing="1.2">IT Student @ CEG  ·  Software Developer</text>
    <text x="80" y="266" fill="#C77B9B" font-size="17" letter-spacing=".6">Exploring AI, Machine Learning &amp; Data Science</text>
    <text x="80" y="342" fill="#F8F0F3" fill-opacity=".55" font-size="11" letter-spacing="3">BUILD WITH INTENT  /  LEARN IN PUBLIC  /  KEEP ITERATING</text>
  </g>

  <path d="M80 294 C220 294 340 294 520 294" fill="none" stroke="#701A3D" stroke-width="2.2" opacity=".75"/>
  <path d="M80 294 C220 294 340 294 520 294" fill="none" stroke="url(#berwin-hero-wine)" stroke-width="2.8" stroke-linecap="round" filter="url(#berwin-hero-soft-glow)" stroke-dasharray="440" stroke-dashoffset="440">
    <animate attributeName="stroke-dashoffset" values="440;0;0" keyTimes="0;.7;1" dur="5.5s" repeatCount="indefinite"/>
  </path>

  <path d="M742 329 C826 286 858 225 940 187 S1084 122 1160 72" fill="none" stroke="url(#berwin-hero-wine)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 9" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="0;-140" dur="16s" repeatCount="indefinite"/>
  </path>
  <g fill="#E5B5C7" opacity=".68">
    <circle cx="742" cy="329" r="2.5"/>
    <circle cx="1160" cy="72" r="2.5"/>
  </g>

  <text x="1118" y="382" text-anchor="end" fill="#E5B5C7" fill-opacity=".45" font-family="monospace" font-size="10" letter-spacing="2">CEG · ANNA UNIVERSITY</text>
</svg>
