ractive seat map, booked seats blocked</text><rect x="36" y="242" width="8" height="8" rx="2" fill="#36BCF7"/><text x="56" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#F1F5F9" text-anchor="start" >Token-based auth with password hashing</text><rect x="456" y="158" width="8" height="8" rx="2" fill="#36BCF7"/><text x="476" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#F1F5F9" text-anchor="start" >Bookings, history and cancel unpaid</text><rect x="456" y="186" width="8" height="8" rx="2" fill="#36BCF7"/><text x="476" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#F1F5F9" text-anchor="start" >Razorpay orders + backend payment verification</text><rect x="456" y="214" width="8" height="8" rx="2" fill="#36BCF7"/><text x="476" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#F1F5F9" text-anchor="start" >Separate show-management service</text><rect x="456" y="242" width="8" height="8" rx="2" fill="#36BCF7"/><text x="476" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#F1F5F9" text-anchor="start" >Booking confirmation after payment</text><text x="36" y="312" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start" letter-spacing="2">FRONTEND</text><rect x="36" y="322" width="64" height="28" rx="14" fill="#16243F" stroke="#36BCF7" stroke-opacity=".45"/><text x="68.0" y="341" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="500" fill="#F1F5F9" text-anchor="middle" >React</text><rect x="110" y="322" width="104" height="28" rx="14" fill="#16243F" stroke="#36BCF7" stroke-opacity=".45"/><text x="162.0" y="341" font-family="'Fira Code', 'SFMono-Re